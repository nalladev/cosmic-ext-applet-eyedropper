name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }}
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            target_rustflags: ""
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target_rustflags: ""
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y libxkbcommon-dev libwayland-dev libdbus-1-dev libpulse-dev libpipewire-0.3-dev libinput-dev appstream
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.15.0
      - name: Install packaging plugins
        run: |
          cargo binstall just
          cargo binstall cargo-deb
          cargo binstall cargo-generate-rpm
      - name: Build packages
        run: |
          just build-release
          just build-deb
          just build-rpm

          NAME="cosmic-ext-applet-eyedropper"
          ARCH=`uname -m`

          mkdir ./$NAME
          cp ./target/release/$NAME ./resources/*.desktop ./resources/*.metainfo.xml ./resources/*.svg ./resources/install.sh  ./$NAME/
          strip -s ./$NAME/$NAME
          tar -czvf $NAME-$ARCH.tar.gz $NAME

          cp ./target/debian/*.deb ./
          cp ./target/generate-rpm/*.rpm ./

          mkdir -p artifacts
          cp $NAME-$ARCH.tar.gz artifacts/
          cp ./*.deb artifacts/
          cp ./*.rpm artifacts/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/
          retention-days: 1

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder

      - name: Add flathub remote
        run: sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtime and SDK
        run: |
          sudo flatpak install -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Sdk.Extension.llvm20//25.08

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --ccache --mirror-screenshots-url=https://dl.flathub.org/media/ \
            --install-deps-from=flathub --repo=flatpak-repo build-dir flatpak/io.github.nalladev.CosmicExtAppletEyedropper.json

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle flatpak-repo cosmic-ext-applet-eyedropper.flatpak \
            io.github.nalladev.CosmicExtAppletEyedropper

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-ext-applet-eyedropper-flatpak
          path: cosmic-ext-applet-eyedropper.flatpak
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, build-flatpak]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" --title "$TAG" --notes-from-tag
      - name: Upload release assets
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" \
            artifacts/aarch64-unknown-linux-gnu/*.tar.gz \
            artifacts/x86_64-unknown-linux-gnu/*.tar.gz \
            artifacts/aarch64-unknown-linux-gnu/*.deb \
            artifacts/x86_64-unknown-linux-gnu/*.deb \
            artifacts/aarch64-unknown-linux-gnu/*.rpm \
            artifacts/x86_64-unknown-linux-gnu/*.rpm \
            artifacts/cosmic-ext-applet-eyedropper-flatpak/cosmic-ext-applet-eyedropper.flatpak \
            --clobber
      - name: Create and upload checksums
        run: |
          TAG="${{ github.ref_name }}"
          cd artifacts
          find . \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.flatpak' \) | xargs sha256sum > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo ${{ github.repository }}
