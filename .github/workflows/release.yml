name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo check
        run: cargo check --locked

  build:
    name: Cargo Build (Release)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo build (release)
        run: cargo build --release --locked

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-ext-applet-eyedropper-x86_64
          path: target/release/cosmic-ext-applet-eyedropper
          retention-days: 30

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder

      - name: Install Flatpak runtime and SDK
        run: |
          flatpak install -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Sdk.Extension.llvm20//25.08

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --install-deps-from=flathub \
            --install-deps-only build-dir flatpak/io.github.nalladev.CosmicExtAppletEyedropper.json
          flatpak-builder --force-clean --ccache --mirror-screenshots-url=https://dl.flathub.org/media/ \
            build-dir flatpak/io.github.nalladev.CosmicExtAppletEyedropper.json

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle build-dir cosmic-ext-applet-eyedropper.flatpak \
            io.github.nalladev.CosmicExtAppletEyedropper

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-ext-applet-eyedropper-flatpak
          path: cosmic-ext-applet-eyedropper.flatpak
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, build-flatpak]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cosmic-ext-applet-eyedropper-x86_64/cosmic-ext-applet-eyedropper
            artifacts/cosmic-ext-applet-eyedropper-flatpak/cosmic-ext-applet-eyedropper.flatpak
          draft: true
          generate_release_notes: true