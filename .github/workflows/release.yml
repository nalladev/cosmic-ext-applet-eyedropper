name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }}
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            target_rustflags: ""
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target_rustflags: ""
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          scripts/install-deps.sh
          sudo apt-get install -y appstream
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.15.0
      - name: Install packaging plugins
        run: |
          cargo binstall just
          cargo binstall cargo-deb
          cargo binstall cargo-generate-rpm
      - name: Build packages
        run: |
          just build-release
          just build-deb
          just build-rpm

          NAME="cosmic-ext-applet-eyedropper"
          ARCH=`uname -m`

          mkdir ./$NAME
          cp ./target/release/$NAME ./resources/*.desktop ./resources/*.metainfo.xml ./resources/*.svg ./resources/install.sh  ./$NAME/
          strip -s ./$NAME/$NAME
          tar -czvf $NAME-$ARCH.tar.gz $NAME

          cp ./target/debian/*.deb ./
          cp ./target/generate-rpm/*.rpm ./

          mkdir -p artifacts
          cp $NAME-$ARCH.tar.gz artifacts/
          cp ./*.deb artifacts/
          cp ./*.rpm artifacts/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/
          retention-days: 1

  # Disabled via `if: false`: the canonical Flatpak build happens in
  # pop-os/cosmic-flatpak. This job only produced a convenience .flatpak
  # bundle for the GitHub release. Re-enable by removing `if: false` and
  # adding the job back to the `release` job's `needs` and its uploads below.
  build-flatpak:
    if: false
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder

      - name: Add flathub remote
        run: sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtime and SDK
        run: |
          sudo flatpak install -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Sdk.Extension.llvm20//25.08

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --ccache --mirror-screenshots-url=https://dl.flathub.org/media/ \
            --install-deps-from=flathub --repo=flatpak-repo build-dir io.github.nalladev.CosmicExtAppletEyedropper.json

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle flatpak-repo cosmic-ext-applet-eyedropper.flatpak \
            io.github.nalladev.CosmicExtAppletEyedropper

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-ext-applet-eyedropper-flatpak
          path: cosmic-ext-applet-eyedropper.flatpak
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" --title "$TAG" --generate-notes
      - name: Upload release assets
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" \
            artifacts/aarch64-unknown-linux-gnu/*.tar.gz \
            artifacts/x86_64-unknown-linux-gnu/*.tar.gz \
            artifacts/aarch64-unknown-linux-gnu/*.deb \
            artifacts/x86_64-unknown-linux-gnu/*.deb \
            artifacts/aarch64-unknown-linux-gnu/*.rpm \
            artifacts/x86_64-unknown-linux-gnu/*.rpm \
            --clobber
      - name: Create and upload checksums
        run: |
          TAG="${{ github.ref_name }}"
          cd artifacts
          find . \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) | xargs sha256sum > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo ${{ github.repository }}

  update-cosmic-flatpak:
    name: Update COSMIC Flatpak and open PR
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Check out released eyedropper source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          path: eyedropper

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate cargo sources
        working-directory: eyedropper
        run: |
          git clone --depth 1 https://github.com/flatpak/flatpak-builder-tools.git "$RUNNER_TEMP/flatpak-builder-tools"
          python3 -m pip install aiohttp tomlkit PyYAML
          python3 "$RUNNER_TEMP/flatpak-builder-tools/cargo/flatpak-cargo-generator.py" \
            -o cargo-sources.json Cargo.lock

      - name: Point Flatpak manifest at this release
        working-directory: eyedropper
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/flatpak-manifest.py to-git \
            "$RELEASE_TAG" \
            "https://github.com/nalladev/cosmic-ext-applet-eyedropper.git" \
            io.github.nalladev.CosmicExtAppletEyedropper.json

      - name: Check out upstream Flatpak master
        uses: actions/checkout@v5
        with:
          repository: pop-os/cosmic-flatpak
          ref: master
          token: ${{ secrets.COSMIC_FLATPAK_TOKEN }}
          path: cosmic-flatpak
          fetch-depth: 0

      - name: Update files and push branch to fork
        env:
          GH_TOKEN: ${{ secrets.COSMIC_FLATPAK_TOKEN }}
        run: |
          set -euo pipefail
          cd cosmic-flatpak

          git remote add fork https://x-access-token:${GH_TOKEN}@github.com/nalladev/cosmic-flatpak.git
          git fetch origin master
          git fetch fork

          BRANCH="automation/eyedropper-${{ github.ref_name }}"
          git switch --force-create "$BRANCH" origin/master

          APP_DIR="app/io.github.nalladev.CosmicExtAppletEyedropper"
          cp "../eyedropper/io.github.nalladev.CosmicExtAppletEyedropper.json" \
            "$APP_DIR/io.github.nalladev.CosmicExtAppletEyedropper.json"
          cp ../eyedropper/cargo-sources.json "$APP_DIR/cargo-sources.json"

          if git diff --quiet -- "$APP_DIR/io.github.nalladev.CosmicExtAppletEyedropper.json" "$APP_DIR/cargo-sources.json"; then
            echo "No Flatpak changes for this release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APP_DIR/io.github.nalladev.CosmicExtAppletEyedropper.json" "$APP_DIR/cargo-sources.json"
          git commit -m "Update Eyedropper Flatpak to ${{ github.ref_name }}"
          git push --force-with-lease fork "$BRANCH"

          if gh pr view "$BRANCH" --repo pop-os/cosmic-flatpak >/dev/null 2>&1; then
            echo "Updated existing PR for $BRANCH."
          else
            gh pr create \
              --repo pop-os/cosmic-flatpak \
              --base master \
              --head "nalladev:$BRANCH" \
              --title "Update Eyedropper Flatpak to ${{ github.ref_name }}" \
              --body "Updates the Eyedropper Flatpak manifest and generated Cargo sources for release ${{ github.ref_name }}."
          fi
