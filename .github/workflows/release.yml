name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }}
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            target_rustflags: ""
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target_rustflags: ""
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y libxkbcommon-dev libwayland-dev libdbus-1-dev libpulse-dev libpipewire-0.3-dev libinput-dev appstream
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.15.0
      - name: Install packaging plugins
        run: |
          cargo binstall just
          cargo binstall cargo-deb
          cargo binstall cargo-generate-rpm
      - name: Build packages
        run: |
          just build-release
          just build-deb
          just build-rpm

          NAME="cosmic-ext-applet-eyedropper"
          ARCH=`uname -m`

          mkdir ./$NAME
          cp ./target/release/$NAME ./resources/*.desktop ./resources/*.metainfo.xml ./resources/*.svg ./resources/install.sh  ./$NAME/
          strip -s ./$NAME/$NAME
          tar -czvf $NAME-$ARCH.tar.gz $NAME

          cp ./target/debian/*.deb ./
          cp ./target/generate-rpm/*.rpm ./

          mkdir -p artifacts
          cp $NAME-$ARCH.tar.gz artifacts/
          cp ./*.deb artifacts/
          cp ./*.rpm artifacts/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/
          retention-days: 1
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" --title "$TAG" --notes-from-tag
      - name: Upload release assets
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" \
            artifacts/aarch64-unknown-linux-gnu/*.tar.gz \
            artifacts/x86_64-unknown-linux-gnu/*.tar.gz \
            artifacts/aarch64-unknown-linux-gnu/*.deb \
            artifacts/x86_64-unknown-linux-gnu/*.deb \
            artifacts/aarch64-unknown-linux-gnu/*.rpm \
            artifacts/x86_64-unknown-linux-gnu/*.rpm \
            --clobber
      - name: Create and upload checksums
        run: |
          TAG="${{ github.ref_name }}"
          cd artifacts
          find . \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) | xargs sha256sum > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo ${{ github.repository }}
