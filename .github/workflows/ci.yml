name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: extractions/setup-just@v4
      - name: Install dependencies
        run: scripts/install-deps.sh
      - name: Run clippy
        run: just lint

  validate-flatpak:
    name: Validate Flatpak Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install flatpak-builder and appstreamcli
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder python3 python3-pip appstream

      - name: Checkout flatpak-builder-tools
        run: |
          git clone --depth 1 https://github.com/flatpak/flatpak-builder-tools.git

      - name: Install Python dependencies for generator
        run: |
          pip3 install --break-system-packages aiohttp tomlkit PyYAML

      - name: Generate cargo-sources.json
        run: |
          python3 flatpak-builder-tools/cargo/flatpak-cargo-generator.py \
            -o cargo-sources.json Cargo.lock

      - name: Validate manifest syntax
        run: |
          flatpak-builder --show-manifest io.github.nalladev.CosmicExtAppletEyedropper.json > /dev/null

      - name: Validate AppStream metadata
        run: |
          appstreamcli validate resources/app.metainfo.xml

      - name: Lint Flatpak manifest
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/mnt" \
            ghcr.io/flathub/flatpak-builder-lint:latest \
            manifest --gha-format /mnt/io.github.nalladev.CosmicExtAppletEyedropper.json
