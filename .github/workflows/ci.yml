name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: scripts/install-deps.sh
      - name: Run clippy
        run: just lint

  validate-flatpak:
    name: Validate Flatpak Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install flatpak-builder and appstreamcli
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder python3 appstream

      - name: Validate manifest syntax
        run: |
          flatpak-builder --show-manifest flatpak/io.github.nalladev.CosmicExtAppletEyedropper.json > /dev/null

      - name: Validate AppStream metadata
        run: |
          appstreamcli validate resources/app.metainfo.xml

      - name: Checkout flatpak-builder-tools
        run: |
          git clone --depth 1 https://github.com/flatpak/flatpak-builder-tools.git

      - name: Install Python dependencies for generator
        run: |
          pip3 install aiohttp tomlkit PyYAML

      - name: Check cargo-sources.json is up to date
        run: |
          OUT="flatpak/cargo-sources.json"
          REGEN="flatpak/cargo-sources-regen.json"

          if [ ! -f "$OUT" ]; then
            echo "Error: $OUT is missing. Run 'just vendor-flatpak' to generate it."
            exit 1
          fi

          python3 flatpak-builder-tools/cargo/flatpak-cargo-generator.py -o "$REGEN" Cargo.lock

          if ! cmp -s "$OUT" "$REGEN"; then
            echo "Error: $OUT is out of date with Cargo.lock."
            echo "Run 'just vendor-flatpak' locally and commit the updated file."
            diff -u "$OUT" "$REGEN" || true
            rm "$REGEN"
            exit 1
          fi

          rm "$REGEN"
          echo "$OUT is up to date."
